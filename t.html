<html>
<head>
    <title>Task 3 - Navigation Bar</title>
    <style>
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color:darkgreen;
            display: flex;
        }

        nav li {
            float: left;
        }

        nav li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-family: sans-serif;
            font-weight: bold;
        }

        nav li a.wavy-underline {
            text-decoration: underline wavy white;
        }


        nav li:nth-child(1) a { background-color:darkgreen; }
        nav li:nth-child(2) a { background-color:darkgreen; } 
        nav li:nth-child(3) a { background-color:darkgreen; } 
        nav li:nth-child(4) a { background-color:darkgreen; }
        nav li:nth-child(5) a { background-color:darkgreen; } 

        nav li a:hover {
            background-color: black !important; 
        }

        nav li a:active {
            background-color: #444444 !important;
        }
    </style>
</head>
<body>
    <nav>
        <ul>

            <li><a href="#" class="wavy-underline">Home</a></li>
            <li><a href="#">News</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Schedule</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </nav>
    <p>Use unordered list to create a navigation bar</p>
</body>
</html>
